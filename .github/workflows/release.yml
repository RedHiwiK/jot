name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag matches the CLI version
        run: |
          version=$(go run ./cmd/jot --version); version=${version##* }
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match internal/cli.Version $version" >&2
            exit 1
          fi
      - name: Test
        run: |
          go test ./...
          (cd macos && swift test)
      - name: Build artifacts
        run: scripts/dist.sh
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
